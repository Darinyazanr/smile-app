<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技术支持 - 今日微笑</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: #FAFAFA;
      color: #1F2937;
      line-height: 1.8;
      padding: 40px 20px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      text-align: center;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .desc { color: #64748B; margin-bottom: 32px; font-size: 15px; }
    h2 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; color: #F59E0B; }
    p { color: #475569; margin-bottom: 12px; }
    a { color: #F59E0B; text-decoration: none; }
    .links { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .link-card {
      display: block;
      background: #FEF3C7;
      border-radius: 12px;
      padding: 14px 20px;
      text-align: left;
      font-weight: 500;
    }
    .link-card small { color: #92400E; font-weight: 400; }
    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #F1F5F9;
      color: #94A3B8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">😊</div>
    <h1>今日微笑 · 技术支持</h1>
    <p class="desc">极简情绪记录，每天一个微笑</p>

    <h2>常见问题</h2>
    <p><strong>Q：我的打卡数据安全吗？</strong><br>所有数据仅存储在您的手机本地，不会上传到任何服务器。卸载 App 即彻底清除。</p>
    <p><strong>Q：换手机了数据能迁移吗？</strong><br>当前版本数据仅存本地，暂不支持跨设备迁移。我们正在开发云同步功能。</p>
    <p><strong>Q：通知不生效？</strong><br>请检查手机系统设置中是否允许「今日微笑」发送通知，并在 App 设置中确认提醒开关已打开。</p>

    <h2>联系我们</h2>
    <p>如有任何问题、建议或反馈，欢迎通过以下方式联系：</p>
    <div class="links">
      <a class="link-card" href="https://github.com/Darinyazanr/smile-app/issues">
        💬 GitHub Issues <small>— 提交问题或建议</small>
      </a>
      <a class="link-card" href="../privacy/">
        🔒 隐私政策
      </a>
      <a class="link-card" href="../terms/">
        📋 用户协议
      </a>
    </div>

    <div class="footer">
      © 2026 今日微笑 · 愿你每天都有一万个理由微笑 🌻
    </div>
  </div>
</body>
</html>
